org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# Authentication defaults to the shared demo, which skips login.
# Follow ../docs/AUTH_SETUP.md to enable accounts in both Android and Go.
# circleAuthMode=emulator
# For a physical phone using adb reverse:
# circleApiBaseUrl=http://127.0.0.1:8080
# circleAuthEmulatorHost=127.0.0.1
circleAuthMode=firebase
circleApiBaseUrl=http://127.0.0.1:8080